const c=document.querySelector('canvas'),g=c.getContext('2d'),R=Math.random,T=Math.PI*2;let w,h,s,cx,cy;function resize(){let d=Math.min(devicePixelRatio,2);w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0);s=Math.min(w*.34,h*.27);cx=w/2;cy=h*.72}resize();onresize=resize;const p=Array.from({length:12500},()=>{let u=R(),a=u*T*12+(R()-.5)*.65;return {u,a,r:(1-u)*(.82+R()*.24),b:R(),k:R()*T}}),lights=Array.from({length:100},()=>({u:R(),a:R()*T,k:R()*T,col:['#ff4545','#61ff9a','#72aaff','#ffe7a3'][R()*4|0]})),stars=Array.from({length:220},()=>[R(),R(),R()*T]);let sparks=[],last=0;function glow(x,y,r,col){let z=g.createRadialGradient(x,y,0,x,y,r);z.addColorStop(0,col);z.addColorStop(1,'transparent');g.fillStyle=z;g.fillRect(x-r,y-r,r*2,r*2)}function project(u,a,r,t){let z=Math.sin(a+t)*r;let f=3.5/(3.5-z);return [cx+Math.cos(a+t)*r*s*f,cy-u*s*2.15*f+z*s*.16,f]};function frame(ms){let t=ms/1000,rot=t*.45,build=Math.min(1,t/3.3);g.globalCompositeOperation='source-over';g.fillStyle='#080605';g.fillRect(0,0,w,h);g.globalCompositeOperation='lighter';for(let [x,y,k] of stars){g.fillStyle=`rgba(255,207,130,${.12+.18*(1+Math.sin(t+k))})`;g.fillRect(x*w,y*h,1,1)}for(let j=0;j<900;j++){let a=j/900*T*2+rot,r=1.12+.07*Math.sin(j*13);let x=cx+Math.cos(a)*s*r,y=cy+Math.sin(a)*s*.18;g.fillStyle=j%5?'#77501e':'#ffd58b';g.fillRect(x,y,1.4,1.4)}for(let q of p){if(q.u>build)continue;let [x,y,f]=project(q.u,q.a,q.r,rot);let b=.35+.55*(.5+.5*Math.sin(q.k+t*2));g.fillStyle=`rgba(255,${150+Math.floor(q.b*90)},${60+Math.floor(q.b*130)},${b})`;let r=(.45+q.b*.85)*f;g.fillRect(x,y,r,r)}for(let q of lights){if(q.u>build)continue;let [x,y,f]=project(q.u,q.a,(1-q.u)*.96,rot);let b=.5+.5*Math.sin(t*3+q.k);g.globalAlpha=.45+b*.55;glow(x,y,8*f,q.col);g.fillStyle='#fff4cb';g.fillRect(x-1,y-1,2,2);g.globalAlpha=1}if(build>.98){let x=cx,y=cy-2.15*s;glow(x,y,65,'#b66c23');glow(x,y,22,'#fff4c2');g.strokeStyle='#ffe3a0';for(let i=0;i<8;i++){let a=i*T/8;let r=(i%2?25:55)*(1+.1*Math.sin(t*4));let z=g.createLinearGradient(x,y,x+Math.cos(a)*r,y+Math.sin(a)*r);z.addColorStop(0,'#fff');z.addColorStop(1,'transparent');g.strokeStyle=z;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);g.stroke()}if(t-last>1.15){last=t;let x=w*(.15+R()*.7),y=h*(.08+R()*.4);for(let i=0;i<95;i++){let a=R()*T,v=20+R()*95;sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,b:t,l:1.1+R()*1.2})}}}sparks=sparks.filter(q=>t-q.b<q.l);for(let q of sparks){let a=t-q.b,x=q.x+q.vx*a,y=q.y+q.vy*a+22*a*a;g.strokeStyle=`rgba(255,195,95,${(1-a/q.l)*.7})`;g.beginPath();g.moveTo(x,y);g.lineTo(x-q.vx*.065,y-q.vy*.065);g.stroke()}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
